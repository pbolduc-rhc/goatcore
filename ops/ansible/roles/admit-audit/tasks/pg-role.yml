---
# ops/ansible/roles/admit-audit/tasks/pg-role.yml (deploy.yml imports it)
#
# The admit_audit role, its password and its grants are written on the
# primary only. A standby (router_role B once site-bootstrap's streaming
# replication has run) is read-only and receives them from the primary;
# writing there fails with "cannot execute ALTER ROLE in a read-only
# transaction", so every re-run of site-bootstrap failed on B. Its first run
# passed only because B was not a standby yet.

- name: Ask whether this host's postgres is a standby
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgres_superuser_password }}"
      - postgres-a
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - -tAc
      - SELECT pg_is_in_recovery();
  register: admit_audit_pg_recovery
  changed_when: false
  no_log: true

- name: Require an explicit PostgreSQL recovery state before role changes
  ansible.builtin.assert:
    that:
      - (admit_audit_pg_recovery.stdout | trim) in ['t', 'f']
    fail_msg: "Cannot determine whether PostgreSQL is primary or standby; no role changes made."

- name: Note whether this host's postgres is a standby
  ansible.builtin.set_fact:
    admit_audit_pg_is_standby: "{{ (admit_audit_pg_recovery.stdout | trim) == 't' }}"

- name: Create 'admit_audit' PG role if missing
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgres_superuser_password }}"
      - postgres-a
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - -v
      - ON_ERROR_STOP=1
      - -c
      - |
        DO $$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ pg_admit_audit_role }}') THEN
            CREATE ROLE {{ pg_admit_audit_role }} LOGIN;
          END IF;
        END
        $$;
  changed_when: false
  no_log: true
  when: not admit_audit_pg_is_standby

- name: Set 'admit_audit' role password (idempotent-on-rotate)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgres_superuser_password }}"
      - postgres-a
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "ALTER ROLE {{ pg_admit_audit_role }} WITH PASSWORD '{{ admit_audit_password }}';"
  changed_when: true
  no_log: true
  when: not admit_audit_pg_is_standby

- name: Grant CONNECT on target DB to 'admit_audit' role
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgres_superuser_password }}"
      - postgres-a
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "GRANT CONNECT ON DATABASE {{ pg_admit_audit_db }} TO {{ pg_admit_audit_role }};"
  changed_when: false
  no_log: true
  when: not admit_audit_pg_is_standby

# Grant SELECT on public.peers only. Wrapped in a DO block so the role
# no-ops cleanly if Netbird hasn't migrated the schema yet (greenfield
# ordering: this role can run before the first management-a start, and
# the table materializes later).
- name: Grant SELECT on public.peers to 'admit_audit' (best-effort)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgres_superuser_password }}"
      - postgres-a
      - psql
      - -U
      - postgres
      - -d
      - "{{ pg_admit_audit_db }}"
      - -v
      - ON_ERROR_STOP=0
      - -c
      - |
        DO $$
        BEGIN
          IF EXISTS (
            SELECT 1 FROM information_schema.tables
            WHERE table_schema = 'public' AND table_name = 'peers'
          ) THEN
            EXECUTE 'GRANT USAGE ON SCHEMA public TO {{ pg_admit_audit_role }}';
            EXECUTE 'GRANT SELECT ON public.peers TO {{ pg_admit_audit_role }}';
          END IF;
        END
        $$;
  changed_when: false
  no_log: true
  failed_when: false
  when: not admit_audit_pg_is_standby
